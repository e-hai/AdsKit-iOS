name: iOS CI

on:
  push:
    branches: [ ios ]
  pull_request:
    branches: [ ios ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app
      - name: Run Tests
        run: swift test --filter AdsCoreTests
